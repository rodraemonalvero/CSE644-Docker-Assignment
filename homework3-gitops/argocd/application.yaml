apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cse644-python-web
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rodraemonalvero/CSE644-Docker-Assignment.git
    targetRevision: main
    path: homework3-gitops/application

  destination:
    server: https://kubernetes.default.svc
    namespace: cse644

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true